site_name: Lefts
site_description: Composable transformations for ML model experimentation
repo_url: https://github.com/nsmat/lefts
repo_name: nsmat/lefts

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Getting Started: understanding-lefts.md
  - Design Philosophy: design-philosophy.md
  - Examples:
    - Quantile regressions with lift and feed: notebooks/quantile_regressions_with_lift_and_feed.ipynb
    - LGBM rolling retrain with early stopping: notebooks/lgbm_rolling_retrain_early_stopping_using_lifts_and_validation_sets.ipynb
    - Teacher-student models with feed: notebooks/teacher_student_with_feed.ipynb
    - Geometric models with lift: notebooks/geometric_models_with_lift.ipynb
  - API Reference:
    - Commands: api/commands.md
    - Model: api/model.md
    - Helpers: api/helpers.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
